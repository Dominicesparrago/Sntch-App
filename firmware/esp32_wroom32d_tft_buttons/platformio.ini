[platformio]
default_envs = esp32wroom32d_tft_buttons
src_dir = .

[env:esp32wroom32d_tft_buttons]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
