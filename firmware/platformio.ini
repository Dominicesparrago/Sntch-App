; SNTCH ESP32-WROOM-32D controller target
;
;   pio run -e esp32wroom32d        build the firmware
;   pio run -e esp32wroom32d -t upload
;   pio run -e esp32wroom32d -t buildfs
;   pio run -e esp32wroom32d -t uploadfs (replaces LittleFS contents; first-use only)
;
; The `native` environment builds the same portable core for host tests and the
; classroom simulator in tools/host_sim.

[platformio]
default_envs = esp32wroom32d

[env:esp32wroom32d]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = esptool
upload_speed = 460800
monitor_speed = 115200
board_build.filesystem = littlefs
; huge_app.csv ends at 0x400000 and fits the 4 MB esp32dev flash. It provides
; a 3 MB app, 896 KB filesystem area, NVS/OTA metadata, and a coredump region.
board_build.partitions = huge_app.csv
lib_extra_dirs = lib
build_flags =
  -std=gnu++17
  -I include
  -I lib/sntch_core/include
  -DSNTCH_FIRMWARE_VERSION=\"0.1.0\"
  -DCORE_DEBUG_LEVEL=0
build_unflags = -std=gnu++11
lib_deps =

[env:native]
platform = native
build_flags =
  -std=c++17
  -I include
  -I lib/sntch_core/include
lib_extra_dirs = lib
lib_deps =
