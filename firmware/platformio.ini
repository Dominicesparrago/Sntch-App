; SNTCH classic ESP32 controller on the photo-identified ESP-32U dev board.
; The 38-pin board has onboard micro-USB programming/power; its bridge and
; regulator are visible, but exact IC ratings and flash size must be verified.
;
;   pio run                          default: Option C phone-admin + microSD
;   pio run -e esp32_dual           Option A UNO display + ESP32 server firmware
;   pio run -e esp32_solo           alternate integrated ESP32-only firmware
;   pio run -e esp32_phone_admin    Option C: button-free TFT + microSD
;   pio run -t upload               upload default Option C after setup
;   pio run -e esp32_dual -t uploadfs (replaces LittleFS; confirmed blank board only)
;
; The `native` environment builds the same portable core for host tests and the
; classroom simulator in tools/host_sim.

[platformio]
default_envs = esp32_phone_admin

[env:esp32wroom32d]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
upload_protocol = esptool
upload_speed = 460800
monitor_speed = 115200
board_build.filesystem = littlefs
; huge_app.csv ends at 0x400000 and fits the 4 MB esp32dev flash. It provides
; a 3 MB app, 896 KB filesystem area, NVS/OTA metadata, and a coredump region.
board_build.partitions = huge_app.csv
lib_extra_dirs = lib
build_flags =
  -std=gnu++17
  -I include
  -I lib/sntch_core/include
  -DSNTCH_FIRMWARE_VERSION=\"0.1.0\"
  -DSNTCH_AP_PASSWORD=\"${sysenv.SNTCH_AP_PASSWORD}\"
  -DSNTCH_TEACHER_PIN=\"${sysenv.SNTCH_TEACHER_PIN}\"
  -DCORE_DEBUG_LEVEL=0
build_unflags = -std=gnu++11
lib_deps =

[env:native]
platform = native
build_flags =
  -std=c++17
  -I include
  -I lib/sntch_core/include
lib_extra_dirs = lib
lib_deps =

; Keep the standalone/legacy UART target above for existing installations.
[env:esp32_dual]
extends = env:esp32wroom32d
build_flags =
  ${env:esp32wroom32d.build_flags}
  -DSNTCH_DUAL_PANEL=1
  -DSNTCH_UNO_STATUS=0

[env:esp32_solo]
extends = env:esp32wroom32d
build_flags =
  ${env:esp32wroom32d.build_flags}
  -DSNTCH_SOLO_PANEL=1
  -DSNTCH_UNO_STATUS=0
lib_deps = adafruit/Adafruit ST7735 and ST7789 Library@1.12.0

[env:uno_display]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = -<*> +<../uno_display/uno_display.cpp>
lib_deps = adafruit/Adafruit ST7735 and ST7789 Library@1.12.0

[env:esp32_phone_admin]
extends = env:esp32wroom32d
build_flags =
  ${env:esp32wroom32d.build_flags}
  -DSNTCH_PHONE_ADMIN=1
  -DSNTCH_UNO_STATUS=0
  -I phone_admin
build_src_filter = +<*> -<littlefs_storage.cpp> +<../phone_admin/*.cpp>
lib_deps = ${env:esp32_solo.lib_deps}
