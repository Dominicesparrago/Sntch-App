; SNTCH ESP32-S3 controller
;
;   pio run -e esp32s3        build the firmware
;   pio run -e esp32s3 -t upload
;   pio run -e esp32s3 -t uploadfs   (writes LittleFS; firmware formats on first boot)
;
; The `native` environment builds the same portable core for host tests and the
; classroom simulator in tools/host_sim.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
lib_extra_dirs = lib
build_flags =
  -std=gnu++17
  -I include
  -I lib/sntch_core/include
  -DSNTCH_FIRMWARE_VERSION=\"0.1.0\"
  -DCORE_DEBUG_LEVEL=0
build_unflags = -std=gnu++11
lib_deps =

[env:native]
platform = native
build_flags =
  -std=c++17
  -I include
  -I lib/sntch_core/include
lib_extra_dirs = lib
lib_deps =
