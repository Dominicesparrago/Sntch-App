<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SNTCH visual prototype. State is simulated and stored only in this browser. Not connected to any hardware or server.">
<title>SNTCH Visual Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@600;700;800&display=swap">
<script>
/* Theme before first paint. Light is the default. "Match this device" leaves the attribute off, so the OS setting decides. */
(function () {
  var t = 'light';
  try { var d = JSON.parse(localStorage.getItem('sntch.forest.visual.v2') || 'null'); if (d && d.settings && d.settings.theme) t = d.settings.theme; } catch (e) { /* storage blocked: keep light */ }
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* ===== 1. Forest Tech tokens (official palette, roles, radii) ===== */
/* Light is the default. Dark applies when the viewer picks Dark, or picks Match this device and the OS is dark. */
:root{
  --deep-forest:#10281D;--forest:#14532D;--emerald:#059669;--mint:#34D399;--pale:#DCECE2;
  --side-grad:linear-gradient(160deg,#0E2419 0%,#113B27 55%,#14532D 100%);
  --side-text:#E7FFF0;--side-muted:#ACD5BC;--side-active:#166342;--side-active-text:#F2FFF6;--side-card:#174A31;
  --logo-grad:linear-gradient(145deg,#34D399,#059669);
  --ws:#F2F8F4;--card:#FFFFFF;--border:#DCEBE1;--text:#14291E;--muted:#60766A;--accent:#047857;--avatar:#C9F5DC;
  --btn-grad:linear-gradient(110deg,#047857,#34D399);--btn-text:#052E16;
  --track:#DEEEE4;--fill-grad:linear-gradient(90deg,#059669,#34D399);--highlight:#D8F4E3;
  --warn-fg:#8A4B05;--warn-bg:#FDF1DC;--bad-fg:#9B1C1C;--bad-bg:#FBE7E7;--info-fg:#1E4E79;--info-bg:#E3EEF9;
  --toast-bg:#10281D;--toast-fg:#E7FFF0;
  --f-head:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:10px;--r:14px;--r-lg:18px;
  --shadow:0 1px 2px rgba(16,40,29,.05),0 6px 16px rgba(16,40,29,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ws:#0C1812;--card:#12241A;--border:#24402F;--text:#E4F5EA;--muted:#A3BFAF;--accent:#34D399;--avatar:#1E4D39;
    --track:#1E3A2B;--highlight:#1A3B2A;--pale:#1A3B2A;--warn-bg:#3A2A10;--warn-fg:#F8D08A;--bad-bg:#3B1717;--bad-fg:#FBB4B4;
    --info-bg:#132C44;--info-fg:#9CC8F0;--shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ws:#0C1812;--card:#12241A;--border:#24402F;--text:#E4F5EA;--muted:#A3BFAF;--accent:#34D399;--avatar:#1E4D39;
  --track:#1E3A2B;--highlight:#1A3B2A;--pale:#1A3B2A;--warn-bg:#3A2A10;--warn-fg:#F8D08A;--bad-bg:#3B1717;--bad-fg:#FBB4B4;
  --info-bg:#132C44;--info-fg:#9CC8F0;--shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}

/* ===== 2. Base and typography (three font roles) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ws);color:var(--text);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;margin:0;letter-spacing:-.01em;color:var(--text)}
h1{font-size:22px;font-weight:800}h2{font-size:17px;font-weight:700}h3{font-size:15.5px;font-weight:700}
p{margin:0}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
summary{list-style:none}summary::-webkit-details-marker{display:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13.5px}.xs{font-size:12px}
.strong{font-weight:700}.grow{flex:1 1 auto;min-width:0}.block{display:block}
.mt{margin-top:12px}.pre{white-space:pre-wrap}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.ico{width:20px;height:20px;flex:none}
.sm-ico{width:14px;height:14px}
[hidden]{display:none!important}

/* ===== 3. App shell: sidebar, topbar, bottom nav ===== */
.app{min-height:100vh}
.shell{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.main{flex:1;padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));min-width:0;outline:none;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding-block:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;position:relative;z-index:40}
.sidebar{position:fixed;inset:0 auto 0 0;width:272px;max-width:86vw;padding-left:env(safe-area-inset-left, 0px);background:var(--side-grad);color:var(--side-text);transform:translateX(-100%);visibility:hidden;transition:transform .25s ease,visibility .25s;z-index:60;display:flex;flex-direction:column;overflow-y:auto;box-shadow:8px 0 24px rgba(0,0,0,.2)}
.nav-open .sidebar{transform:none;visibility:visible}
.backdrop{display:none;position:fixed;inset:0;background:rgba(7,22,15,.45);z-index:55}
.nav-open .backdrop{display:block}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 14px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--logo-grad);display:grid;place-items:center;color:#052E16;flex:none;box-shadow:0 6px 16px rgba(5,150,105,.35)}
.logo.sm{width:30px;height:30px;border-radius:9px}
.logo .ico{width:22px;height:22px}
.brand-text{flex:1;min-width:0}
.brand-mini{display:flex;align-items:center;gap:8px}
.wordmark{display:block;font:800 20px/1.1 var(--f-head);letter-spacing:.04em;color:#F2FFF6}
.wordmark.dark{color:var(--text);font-size:17px}
.brand small{display:block;font-size:12px;color:var(--side-muted)}
.menu-close{color:var(--side-text)}
.snav{padding:4px 12px}
.nav-group{margin-bottom:6px}
.nav-label{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--side-muted);padding:10px 10px 6px}
.snav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--side-text);font-weight:500;text-decoration:none}
.snav a:hover{background:rgba(172,213,188,.12);text-decoration:none}
.snav a[aria-current="page"]{background:var(--side-active);color:var(--side-active-text);font-weight:600}
.side-card{margin:auto 12px 16px;background:var(--side-card);border-radius:var(--r);padding:14px;color:var(--side-text)}
.side-card .xs{color:var(--side-muted)}
.side-status{font-weight:600;display:flex;align-items:center;gap:8px;margin:6px 0}
.side-muted{color:var(--side-muted)!important}
.side-dot{width:9px;height:9px;border-radius:50%;background:var(--mint);display:inline-block;flex:none}
.side-dot-sm{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
.side-dot-sm.s-disconnected{background:var(--bad-fg)}
.side-dot-sm.s-unavailable{background:var(--warn-fg)}
.side-dot-sm.s-syncing{background:var(--info-fg)}
.page-title{flex:1 1 140px;min-width:0}
.page-title h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-title p{display:none}
.menu-btn{display:grid}
.search{order:10;flex:1 1 100%;position:relative}
.search-field{display:flex;align-items:center;gap:8px;position:relative;background:var(--ws);border:1px solid var(--border);border-radius:12px;padding:0 12px;min-height:44px;color:var(--muted)}
.search-field .input{border:0;background:transparent;padding:8px 0;min-height:40px;flex:1;min-width:0;outline:none;box-shadow:none}
.search-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(52,211,153,.3)}
.search-results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.15);padding:6px;z-index:70;max-height:60vh;overflow:auto}
.sr-item{display:flex;flex-direction:column;padding:10px 12px;border-radius:10px;color:var(--text);text-decoration:none}
.sr-item:hover,.sr-item:focus-visible{background:var(--highlight);text-decoration:none}
.role-wrap{order:11;flex:1 1 100%;display:flex}
.role-wrap .seg{width:100%}
.role-wrap .seg button{flex:1;justify-content:center}
.status-chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:99px;background:var(--highlight);color:var(--accent);font:600 12.5px var(--f-body);text-decoration:none;max-width:100%}
.status-chip .chip-text{display:none}
.status-chip:hover{text-decoration:none}
.bottomnav{display:none}
.role-student .bottomnav{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);padding-block:6px calc(6px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));z-index:45;justify-content:space-around;gap:4px;filter:drop-shadow(0 -6px 14px rgba(16,40,29,.15)) drop-shadow(0 -1px 3px rgba(16,40,29,.12))}
.bottomnav a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);border-radius:12px;text-decoration:none}
.bottomnav a:hover{background:var(--highlight);text-decoration:none}
.bottomnav a[aria-current="page"]{color:var(--accent);background:var(--highlight)}
.bottomnav a:active{transform:scale(.94)}
.nav-hump{position:absolute;left:50%;transform:translateX(-50%);top:-28px;width:176px;height:28px;overflow:visible;fill:var(--card);stroke:var(--border);stroke-width:1;pointer-events:none}
.nav-hump path{vector-effect:non-scaling-stroke}
.nav-slot{flex:0 0 76px;display:flex;justify-content:center;align-items:flex-start}
.bottomnav .nav-scan{position:relative;z-index:1;flex:none;width:64px;height:64px;min-height:0;margin-top:-24px;border-radius:50%;display:grid;place-items:center;padding:0;background:var(--btn-grad);color:#fff;box-shadow:0 0 0 5px var(--card),0 6px 14px rgba(4,120,87,.28);text-decoration:none}
.bottomnav .nav-scan:hover{background:var(--btn-grad);filter:brightness(1.05);text-decoration:none}
.bottomnav .nav-scan[aria-current="page"]{background:var(--btn-grad);box-shadow:0 0 0 5px var(--card),0 0 0 7px var(--accent)}
.bottomnav .nav-scan .ico{width:30px;height:30px}
.scan-card{display:grid;gap:14px;justify-items:center;text-align:center}
.viewfinder{position:relative;width:min(300px,100%);aspect-ratio:1/1;border-radius:var(--r-lg);background:var(--side-grad);overflow:hidden;display:grid;place-items:center;box-shadow:var(--shadow)}
.scan-glyph .ico{width:56px;height:56px;color:var(--mint);opacity:.55}
.corner{position:absolute;width:48px;height:48px;border:0 solid var(--mint)}
.corner.tl{top:20px;left:20px;border-top-width:4px;border-left-width:4px;border-top-left-radius:12px}
.corner.tr{top:20px;right:20px;border-top-width:4px;border-right-width:4px;border-top-right-radius:12px}
.corner.bl{bottom:20px;left:20px;border-bottom-width:4px;border-left-width:4px;border-bottom-left-radius:12px}
.corner.br{bottom:20px;right:20px;border-bottom-width:4px;border-right-width:4px;border-bottom-right-radius:12px}
.scan-line{position:absolute;left:14%;right:14%;top:50%;height:2px;background:var(--mint);box-shadow:0 0 12px var(--mint);animation:scanline 2.4s ease-in-out infinite alternate}
@keyframes scanline{from{top:24%}to{top:76%}}
.role-student .main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.exam-focus .bottomnav{display:none}
.exam-focus .main{padding-bottom:16px}
.role-student .shell{max-width:480px;margin:0 auto;width:100%}
.role-student .sidebar{display:none}
.menu-wrap{position:relative;display:inline-block}
.menu-wrap>summary{position:relative}
.menu-panel{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:6px;z-index:70}
.menu-panel.wide{width:min(340px,86vw)}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;background:transparent;border-radius:10px;text-align:left;font-weight:600;color:var(--text)}
.menu-item:hover{background:var(--highlight)}
.menu-item.danger{color:var(--bad-fg)}
.menu-item .ico{width:18px;height:18px}
.menu-head{padding:8px 10px;font-size:14px}
.count-dot{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:99px;background:var(--emerald);color:#fff;font:700 11px/18px var(--f-body);text-align:center;padding:0 4px}
.notif{list-style:none;margin:0;padding:4px 8px 8px;max-height:320px;overflow:auto}
.notif li{display:flex;justify-content:space-between;gap:10px;padding:9px 6px;border-bottom:1px solid var(--border);font-size:13.5px}

/* ===== 4. Buttons, badges, cards, forms ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font:600 15px/1 var(--f-body);text-decoration:none;transition:background .15s,box-shadow .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--highlight);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed;background:var(--track);transform:none}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--btn-grad);color:var(--btn-text);border-color:transparent;box-shadow:0 4px 14px rgba(4,120,87,.22)}
.btn-primary:hover{filter:brightness(1.04);background:var(--btn-grad)}
.btn-primary:disabled{background:var(--track);color:var(--muted);box-shadow:none}
.btn-danger{color:var(--bad-fg);border-color:var(--bad-bg)}
.btn-danger-solid{background:#9B1C1C;color:#fff;border-color:transparent}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn-sm svg{width:16px;height:16px}
.btn-lg{min-height:52px;font-size:16px;padding:0 20px}
.btn.is-loading{pointer-events:none}
.btn.is-loading::after{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);display:inline-grid;place-items:center;text-decoration:none;flex:none}
.icon-btn:hover{background:var(--highlight);color:var(--accent);text-decoration:none}
.icon-btn.sm{width:36px;height:36px;border-radius:10px}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn-row.btn-grid{display:grid;grid-template-columns:1fr 1fr}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:8px;background:var(--track);font-size:12.5px;font-weight:600;color:var(--muted);border:0}
button.tag{cursor:pointer}
.tag-type{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--avatar);color:var(--accent);display:inline-grid;place-items:center;font:700 14px var(--f-head);cursor:pointer;flex:none;border:0}
.avatar.lg{width:56px;height:56px;font-size:18px}
.person{display:flex;gap:12px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--f-body);padding:6px 9px;border-radius:99px;white-space:nowrap;background:var(--track);color:var(--muted)}
.badge .ico{width:13px;height:13px}
.b-ok{background:var(--highlight);color:var(--accent)}
.b-warn{background:var(--warn-bg);color:var(--warn-fg)}
.b-bad{background:var(--bad-bg);color:var(--bad-fg)}
.b-info{background:var(--info-bg);color:var(--info-fg)}
.b-muted{background:var(--track);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px;background:var(--muted)}
.dot.t-ok{background:var(--emerald)}.dot.t-warn{background:#C98A1B}.dot.t-info{background:#3B82C4}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head>div:first-child{min-width:0}
.card-head h3{font-size:16px}
.card.stat{display:grid;gap:4px}
.stat-top{display:flex;align-items:center;gap:8px}
.stat .label{font:600 13px var(--f-body);color:var(--muted)}
.stat .value{font:800 26px/1.1 var(--f-head);margin-top:4px;font-variant-numeric:tabular-nums;color:var(--text)}
.stat .sub{font-size:12.5px;color:var(--muted)}
.chip-ico{width:30px;height:30px;border-radius:9px;background:var(--highlight);color:var(--accent);display:inline-grid;place-items:center;flex:none}
.chip-ico .ico{width:17px;height:17px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;min-width:0}
.grid>*{min-width:0}
.grid.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.progress{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.progress>span{display:block;height:100%;border-radius:inherit;background:var(--fill-grad);transition:width .4s ease}
.list{list-style:none;margin:0;padding:0}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.list-item:last-child{border-bottom:0}
.stack-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cards-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.code{font:500 15px var(--f-mono);letter-spacing:.12em;background:var(--highlight);border:1px dashed var(--accent);border-radius:10px;padding:6px 10px;color:var(--accent);display:inline-block}
.code-sm{font-size:12.5px;padding:3px 7px}
.code-lg{font-size:24px;padding:10px 14px;margin:6px 0 10px}
.facts{display:grid;gap:10px;margin:12px 0 0}
.facts>div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding-bottom:8px}
.facts dt{color:var(--muted);font-size:13.5px}
.facts dd{margin:0;font-weight:600;text-align:right}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;background:var(--pale);color:var(--text);font-size:14px}
.notice>div{min-width:0}
.notice .ico{margin-top:1px}
.notice.n-info{background:var(--info-bg);color:var(--info-fg)}
.notice.n-warn{background:var(--warn-bg);color:var(--warn-fg)}
.notice.n-bad{background:var(--bad-bg);color:var(--bad-fg)}
.notice.n-ok{background:var(--highlight);color:var(--accent)}
.empty{text-align:center;padding:26px 14px;display:grid;justify-items:center;gap:6px;color:var(--muted)}
.empty h3{color:var(--text)}
.empty .ring{width:52px;height:52px;border-radius:50%;background:var(--highlight);color:var(--accent);display:grid;place-items:center;margin-bottom:4px}
.empty .ico{width:24px;height:24px}
.empty-cell{padding:0!important}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--track),var(--card),var(--track));background-size:200% 100%;animation:shimmer 1.2s infinite;margin-top:8px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sheet{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;min-height:36px;width:max-content}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:21px;margin-top:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .select,.toolbar .input{width:auto;min-width:0}
.toolbar .search-field{min-width:200px;flex:1 1 220px}
.seg{display:inline-flex;background:var(--track);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 12px;border:0;background:transparent;border-radius:9px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg button .ico{width:16px;height:16px}
.quick{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.quick .btn{justify-content:flex-start}
.att-grid{display:grid;gap:14px}
.att-item{display:grid;gap:8px}
.att-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.att-row:last-child{border-bottom:0}
.att-seg{display:flex;gap:6px;flex-wrap:wrap}
.att-seg button{min-height:44px;min-width:78px;padding:0 10px;border:1px solid var(--border);border-radius:12px;background:var(--card);font-weight:600;font-size:14px;color:var(--muted)}
.att-seg button[aria-pressed="true"]{background:var(--highlight);color:var(--accent);border-color:var(--emerald)}
.att-seg button:hover{background:var(--highlight)}
.dist{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px}
.dist-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.dist-bar{width:100%;max-width:56px;background:var(--fill-grad);border-radius:8px 8px 4px 4px;min-height:3px}
.dev-hero{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dev-ico{width:48px;height:48px;border-radius:14px;background:var(--logo-grad);color:#052E16;display:grid;place-items:center;flex:none}
.join-box{border:1px dashed var(--accent);border-radius:14px;padding:14px;text-align:center;background:var(--ws)}
.steps{margin:12px 0 0 18px;padding:0}
.steps li{margin:4px 0}
.qr-box{width:112px;height:112px;margin:12px auto 4px;border-radius:12px;border:2px dashed var(--border);display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--track) 0 6px,var(--card) 6px 12px);font:600 11px var(--f-body);color:var(--muted);text-align:center;padding:6px}
.mini-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.mini-stats div{background:var(--ws);border-radius:12px;padding:10px 6px;display:grid;gap:2px}
.mini-stats b{font-size:18px}
.prog-cell{display:flex;align-items:center;gap:8px;min-width:120px}
.prog-cell .progress{flex:1}
.qitem{border:1px solid var(--border);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--card)}
.qhead{display:flex;align-items:center;gap:8px}
.qnum{width:28px;height:28px;border-radius:8px;background:var(--track);display:grid;place-items:center;font-weight:600}
.qopts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.qopts li{display:flex;align-items:center;gap:8px;font-size:14.5px}
.qopts li.is-correct{color:var(--accent);font-weight:600}
.opt-letter{width:26px;height:26px;border-radius:8px;background:var(--track);display:inline-grid;place-items:center;font:600 12.5px var(--f-mono);flex:none;color:var(--text)}
.qactions{justify-content:flex-end}
.opt-edit{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center;margin-bottom:8px}
.opt-edit input[type=radio]{width:20px;height:20px;accent-color:var(--accent)}
.plain{border:0;padding:0;margin:0;min-width:0}
.plain:disabled{opacity:.6}
.fieldset{border:0;padding:0;margin:0 0 12px;min-width:0}
.fieldset legend{padding:0;margin-bottom:6px}
.field{display:grid;gap:6px;margin-bottom:14px;min-width:0}
.field .label,.label{font:600 14px var(--f-body)}
.hint{font-size:12.5px;color:var(--muted)}
.input,.select,.textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card);color:var(--text);font-size:16px}
.input:disabled,.select:disabled,.textarea:disabled{opacity:.6}
.textarea{min-height:100px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(52,211,153,.3)}
[aria-invalid="true"]{border-color:var(--bad-fg)!important}
.field-error{font-size:13px;color:var(--bad-fg);font-weight:600}
.row-2{display:grid;gap:12px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.disabled-row{opacity:.6}
.hint-indent{margin:-4px 0 10px 30px}
.conn{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:13.5px}
.conn .side-dot-sm{background:var(--emerald)}

/* ===== 5. Tables (cards on mobile) ===== */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
@media (min-width:720px){.table-wrap{overflow-x:auto}}
.data-table{width:100%;border-collapse:collapse}
.data-table th{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:12px 14px;background:var(--ws);border-bottom:1px solid var(--border)}
.data-table td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table tbody tr:hover{background:var(--highlight)}
.data-table td.actions{white-space:nowrap}
.data-table td.actions>*{margin-right:4px}
.data-table .cell-main a{font-weight:700}
.cell-main .xs{display:block}
@media (max-width:1199px){
  .data-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .data-table,.data-table tbody,.data-table tr,.data-table td{display:block;width:100%}
  .table-wrap{background:transparent;border:0;overflow:visible}
  .data-table tr{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:0 0 10px;padding:6px 12px;box-shadow:var(--shadow)}
  .data-table tr:has(>td.empty-cell){background:transparent;border:0;box-shadow:none;padding:0}
  .data-table tbody tr:hover{background:var(--card)}
  .data-table td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:7px 0;text-align:right;min-width:0}
  .data-table td::before{content:attr(data-label);font-size:12px;color:var(--muted);font-weight:600;text-align:left;flex:none}
  .data-table td.cell-main{display:block;text-align:left;font-size:16px}
  .data-table td.cell-main::before{content:none}
  .data-table td.actions{justify-content:flex-end;flex-wrap:wrap}
  .data-table td.actions::before{content:none}
  .data-table td.empty-cell{display:block;text-align:left;padding:0}
  .data-table td.empty-cell::before{content:none}
  .data-table td:empty{display:none}
}

/* ===== 6. Modal, toast ===== */
#modal-root{position:fixed;inset:0;z-index:80;display:grid;place-items:end center}
.modal-scrim{position:absolute;inset:0;background:rgba(7,22,15,.5)}
.modal{position:relative;background:var(--card);color:var(--text);width:100%;max-height:92vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:sheet .2s ease;min-width:0}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:17px;min-width:0}
.modal-body{padding:16px;overflow:auto;min-height:0}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 32px));display:grid;gap:8px;z-index:90;pointer-events:none}
.role-student .toasts{bottom:calc(88px + env(safe-area-inset-bottom))}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;background:var(--toast-bg);color:var(--toast-fg);border-radius:12px;padding:12px 14px;box-shadow:0 10px 24px rgba(0,0,0,.25);font-size:14.5px;animation:sheet .2s ease}
.toast .ico{color:var(--mint);margin-top:1px}
.toast.t-warn .ico{color:#F5C26B}
.toast.t-error .ico{color:#F2A1A1}
.toast.t-info .ico{color:#93C5FD}

/* ===== 7. Teacher-specific pieces ===== */
.dist-wrap{display:grid}
.review-row{padding:12px 0;border-bottom:1px solid var(--border);display:grid;gap:4px}
.review-row:last-child{border-bottom:0}

/* ===== 8. Student-specific pieces ===== */
.hello{display:grid;gap:4px;padding:4px 2px}
.hello h1{font-size:24px}
.feature{background:var(--side-grad);color:var(--side-text);border-radius:var(--r-lg);padding:18px;display:grid;gap:8px;box-shadow:0 10px 24px rgba(16,40,29,.22)}
.feature h2{color:#F2FFF6;font-size:19px}
.feature .small,.feature .xs{color:var(--side-muted)}
.feature .btn{background:var(--btn-grad);color:var(--btn-text);border-color:transparent;justify-self:start}
.feature .btn-ghost-light{background:transparent;color:var(--side-text);border-color:rgba(172,213,188,.45)}
.item-card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;flex-wrap:wrap;box-shadow:var(--shadow)}
.item-card .grow{min-width:160px}
.item-card h3{margin-top:2px}
.section-title{font-size:16px;margin-top:6px}
.exam-top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;background:var(--card);border-bottom:1px solid var(--border);padding:10px 12px;display:flex;gap:10px;align-items:center}
.timer{font:600 18px var(--f-mono);font-variant-numeric:tabular-nums;padding:7px 10px;border-radius:10px;background:var(--highlight);color:var(--accent);min-width:78px;text-align:center}
.timer.low{background:var(--warn-bg);color:var(--warn-fg)}
.exam-body{display:grid;gap:14px;padding:14px 0}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.qnav button{min-height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card);font:600 15px var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--text)}
.qnav button.answered{background:var(--highlight);border-color:var(--emerald);color:var(--accent)}
.qnav button[aria-current="step"]{box-shadow:0 0 0 2px var(--accent)}
.qcard{display:grid;gap:12px}
.qprompt{font-size:18px;line-height:1.35;outline:none}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 14px;border:1.5px solid var(--border);border-radius:14px;background:var(--card);cursor:pointer;font-size:16px}
.opt:hover{border-color:var(--mint);background:var(--highlight)}
.opt input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--highlight)}
.exam-nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.exam-nav .btn{flex:1 1 130px}
.review-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.review-item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:12px}
.result-hero{text-align:center;display:grid;justify-items:center;gap:8px}
.score-big{font:800 44px/1 var(--f-head);font-variant-numeric:tabular-nums}
.profile-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ===== 9. Responsive: 720px tablet, 1024px desktop ===== */
@media (min-width:720px){
  #modal-root{place-items:center}
  .modal{width:min(560px,92vw);border-radius:20px;max-height:86vh}
  .modal-lg{width:min(700px,94vw)}
  .search{flex:0 1 300px;order:0}
  .role-wrap{order:0;flex:none;width:auto}
  .role-wrap .seg{width:auto}
  .role-wrap .seg button{flex:none}
  .page-title p{display:block;margin-top:2px}
  .create-label{display:inline}
  .status-chip .chip-text{display:inline}
  .grid.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row-2{grid-template-columns:1fr 1fr}
  .main{padding-block:20px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
  .table-wrap{overflow-x:auto}
  .topbar{padding-block:12px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
  .page-title h1{font-size:20px}
  .role-student .main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
}
@media (min-width:1024px){
  .app{display:grid;grid-template-columns:272px minmax(0,1fr)}
  .role-student .app{display:block}
  .sidebar{position:sticky;top:0;height:100vh;transform:none;visibility:visible;box-shadow:none;width:auto;max-width:none}
  .menu-btn,.menu-close,.backdrop{display:none!important}
  .topbar{position:sticky;top:env(safe-area-inset-top, 0px)}
  .grid.cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.two.wide{grid-template-columns:2fr 1fr}
  .role-student .shell{max-width:480px}
}
/* ===== Scrollbars: hidden for phone-like preview (scrolling still works) ===== */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
*::-webkit-scrollbar-corner{display:none}
</style>

    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Student navigation"></nav>
<div class="backdrop" data-action="nav-close" aria-hidden="true"></div>
<div id="modal-root" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ===== 1. Helpers ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const z = (n, w = 2) => String(n).padStart(w, '0');
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
let uidN = 1;

const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
const byId = (list, id) => list.find(x => x.id === id);
const formData = f => Object.fromEntries(new FormData(f));
const nextId = (p, list) => {
  const max = list.reduce((m, x) => Math.max(m, Number((x.id.match(/(\d+)$/) || [0, 0])[1])), 0);
  return `${p}-${z(max + 1, 3)}`;
};
function fdate(ts) {
  if (!ts) return '—';
  const d = new Date(ts), f = S.settings.dateFormat;
  if (f === 'iso') return dayKey(ts);
  if (f === 'dmy') return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
const ftime = ts => ts ? new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '—';
const fdt = ts => ts ? `${fdate(ts)} · ${ftime(ts)}` : '—';

  if (!ts) return '—';

  if (a < MIN) return 'just now';
  const t = a < HOUR ? `${Math.round(a / MIN)} min` : a < DAY ? `${Math.round(a / HOUR)} h` : `${Math.round(a / DAY)} d`;

const RESP = ['Chloroplasts capture light energy, which is stored as glucose.', 'Light is absorbed in the thylakoids while carbon dioxide is fixed in the stroma.', 'Oxygen is released when water molecules are split during the light reactions.', 'Photosynthesis needs light, water, and carbon dioxide to make sugar and oxygen.'];
const mcq = (id, prompt, options, correct) => ({ id, type: 'mc', prompt, options, correct });
const txq = (id, prompt, keys) => ({ id, type: 'text', prompt, keys });

function synth(ex, k) {
  const a = {};
  ex.questions.forEach((q, j) => {
    if (q.type === 'mc') a[q.id] = (k + j) % 5 === 0 ? (q.correct + 1) % q.options.length : q.correct;
    else a[q.id] = (k + j) % 4 === 0 ? 'not sure' : q.keys[0];
  });
  return a;
}
function grade(ex, answers) {
  let score = 0;
  ex.questions.forEach(q => {
    const a = answers[q.id];
    const ok = q.type === 'mc' ? a === q.correct : typeof a === 'string' && q.keys.some(k => k.toLowerCase() === a.trim().toLowerCase());
    if (ok) score++;
  });
  const total = ex.questions.length, percent = total ? Math.round(score / total * 100) : 0;
  return { score, total, percent, passed: percent >= ex.passing };
}
function mkExamSub(ex, studentId, sessionId, k, at) {
  const answers = synth(ex, k), g = grade(ex, answers);
  return { id: uid('sub'), type: 'exam', refId: ex.id, sessionId, studentId, answers, score: g.score, total: g.total, percent: g.percent, passed: g.passed, submittedAt: at, timeout: false, status: 'graded' };
}
function mkActSub(act, studentId, sessionId, k, at, status) {
  return { id: uid('sub'), type: 'activity', refId: act.id, sessionId, studentId, text: RESP[k % RESP.length], submittedAt: at, status };
}

/* Validation: show inline messages, focus the first invalid field. */
function showErr(f, name, msg, focus = true) {
  const el = f.elements.namedItem(name); if (!el) return false;
  el.setAttribute('aria-invalid', 'true');
  const p = document.createElement('p'); p.className = 'field-error'; p.id = `err-${name}`; p.textContent = msg;
  el.setAttribute('aria-describedby', p.id);
  (el.closest('.field') || el.parentElement).appendChild(p);
  if (focus) el.focus();
  return false;
}
function validate(f, rules) {
  f.querySelectorAll('.field-error').forEach(n => n.remove());
  f.querySelectorAll('[aria-invalid]').forEach(n => n.setAttribute('aria-invalid', 'false'));
  let ok = true, first = true;
  rules.forEach(r => {
    const el = f.elements.namedItem(r.name); if (!el) return;
    const v = String(el.value ?? '').trim(); let msg = '';
    if (r.req && !v) msg = r.req;
    else if (v && r.min && v.length < r.min) msg = `Use at least ${r.min} characters.`;
    else if (v && r.max && v.length > r.max) msg = `Use ${r.max} characters or fewer.`;
    else if (v && r.test && !r.test(v)) msg = r.msg;
    if (msg) { ok = false; showErr(f, r.name, msg, first); first = false; }
  });
  return ok;
}

/* Clipboard with fallback; CSV text is built from local data. */
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) { /* use fallback */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

/* ===== 8. Event dispatch (delegation; handlers live in later sections) ===== */
const ACTIONS = {}, INPUTS = {}, CHANGES = {}, FORMS = {};
function closeMenus(target) { $$('details[open]').forEach(d => { if (!target || !d.contains(target)) d.removeAttribute('open'); }); }
function onClick(e) {
  const el = e.target.closest('[data-action]');
  const sr = $('#global-results');
  if (sr && !sr.hidden && !e.target.closest('.search')) sr.hidden = true;
  if (!el) { closeMenus(e.target); return; }
  closeMenus(el);
  if (el.closest('details')) el.closest('details').removeAttribute('open');
  const fn = ACTIONS[el.dataset.action];
  if (!fn || el.disabled) return;
  e.preventDefault();
  fn(el, e);
}
function onInput(e) {
  const el = e.target;
  if (el.dataset.answer && el.type !== 'radio') return onAnswer(el);
  if (el.dataset.input && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el);
}
function onChange(e) {
  const el = e.target;
  if (el.dataset.answer && el.type === 'radio') return onAnswer(el);
  if (el.dataset.change && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el);
}
function onSubmit(e) {
  const f = e.target;
  e.preventDefault(); if (f.dataset && f.dataset.form && FORMS[f.dataset.form]) FORMS[f.dataset.form](f);
}
function onKey(e) {
  const modalOpen = !$('#modal-root').hidden;
  if (e.key === 'Escape') {
    if (modalOpen) return closeModal();
    if (U.navOpen) { U.navOpen = false; document.body.classList.remove('nav-open'); }
    closeMenus(null);
    const sr = $('#global-results'); if (sr) sr.hidden = true;
  }
  if (e.key === 'Tab' && modalOpen) {
    const f = $$('#modal-root button:not([disabled]), #modal-root input:not([type=hidden]), #modal-root select, #modal-root textarea');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}

    const sub = subs.find(x => x.studentId === s.id);
    return `<tr><td data-label="Student" class="cell-main">${esc(s.name)}</td>

  }).join('');
  return `${backLink('#teacher/activities', 'All activities')}
  <div class="page-head"><div class="grow"><p class="small muted">Activity · section ${a.target}</p><h1>${esc(a.title)}</h1></div>${badge(dStatus('activity', a))}</div>
  <div class="btn-row">${itemActions('activity', a)}</div>
  <div class="grid two">
    ${card('Details', `<p>${esc(a.description)}</p><h3 class="mt">Instructions for students</h3><p class="pre mt">${esc(a.instructions)}</p>
      <dl class="facts"><div><dt>Opens</dt><dd>${fdt(a.startsAt)}</dd></div><div><dt>Due</dt><dd>${fdt(a.dueAt)}</dd></div><div><dt>Session code</dt><dd>${open ? `<span class="code code-sm">${open.code}</span>` : 'Not running'}</dd></div></dl>`)}
    ${card('Submission overview', `<p class="small mono">${p.n} of ${p.total} submitted (${p.pct}%)</p>${bar(p.pct, 'Submitted')}
      <p class="small muted mt">${subs.filter(x => x.status === 'pending').length} waiting for review</p>`, subs.some(x => x.status === 'pending') ? `<button type="button" class="btn btn-sm" data-action="sub-review-all" data-id="${a.id}">${I('check')}Mark all reviewed</button>` : '')}
  </div>
  ${card('Students', `<div class="table-wrap"><table class="data-table"><thead><tr><th>Student</th><th>Response</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${rows || `<tr><td class="empty-cell" colspan="4">${empty('users', 'No students in this section', 'Add students to this section and they will appear here.')}</td></tr>`}</tbody></table></div>`)}`;
}

/* -- Examination editor -- */

  return `<form data-form="exam-settings" novalidate><fieldset class="plain" ${locked ? 'disabled' : ''}>
    <input type="hidden" name="id" value="${ex.id}">
    <label class="field"><span class="label">Title</span><input class="input" name="title" value="${esc(ex.title)}" maxlength="80"></label>
    <label class="field"><span class="label">Instructions for students</span><textarea class="textarea" name="instructions" rows="3" maxlength="400">${esc(ex.instructions)}</textarea></label>
    <div class="row-2"><label class="field"><span class="label">Duration (minutes)</span><input class="input mono" type="number" name="duration" min="1" max="120" value="${ex.duration}"></label>
    <label class="field"><span class="label">Passing score (%)</span><input class="input mono" type="number" name="passing" min="0" max="100" value="${ex.passing}"></label></div>
    <div class="row-2"><label class="field"><span class="label">Attempts</span><select class="select" name="attempts"><option value="1" selected>1 attempt</option><option disabled>2 attempts (planned)</option></select></label>
    <label class="field"><span class="label">Audience</span><select class="select" name="target">${secOpts(ex.target)}</select></label></div>
    <div class="row-2"><label class="field"><span class="label">Available from</span><input class="input" type="datetime-local" name="startsAt" value="${toLocalInput(ex.startsAt)}"></label>
    <label class="field"><span class="label">Available until</span><input class="input" type="datetime-local" name="dueAt" value="${toLocalInput(ex.dueAt)}"></label></div>
    <button type="submit" class="btn btn-primary">Save settings</button>
  </fieldset></form>`;
}
function questionsList(ex, locked) {
  if (!ex.questions.length) return empty('file', 'No questions yet', 'Add multiple-choice or short-text questions. Students see them in the order listed here.');
  return `<ol class="stack-list">${ex.questions.map((q, j) => `<li class="qitem">
    <div class="qhead"><span class="qnum mono">${j + 1}</span><span class="tag">${q.type === 'mc' ? 'Multiple choice' : 'Short text'}</span></div>
    <p class="strong">${esc(q.prompt)}</p>
    ${q.type === 'mc' ? `<ol class="qopts">${q.options.map((o, k) => `<li class="${k === q.correct ? 'is-correct' : ''}"><span class="opt-letter">${'ABCD'[k]}</span><span>${esc(o)}</span>${k === q.correct ? '<span class="badge b-ok">Answer key</span>' : ''}</li>`).join('')}</ol>` : `<p class="small muted">Accepted answers: ${esc(q.keys.join(', '))}</p>`}
    <div class="btn-row qactions">
      <button type="button" class="icon-btn sm" data-action="q-move" data-exam="${ex.id}" data-id="${q.id}" data-dir="-1" aria-label="Move question ${j + 1} up" title="Move up" ${locked || j === 0 ? 'disabled' : ''}>${I('arrow-up')}</button>
      <button type="button" class="icon-btn sm" data-action="q-move" data-exam="${ex.id}" data-id="${q.id}" data-dir="1" aria-label="Move question ${j + 1} down" title="Move down" ${locked || j === ex.questions.length - 1 ? 'disabled' : ''}>${I('arrow-down')}</button>
      <button type="button" class="btn btn-sm" data-action="q-edit" data-exam="${ex.id}" data-id="${q.id}" ${locked ? 'disabled' : ''}>${I('edit')}Edit</button>
      <button type="button" class="btn btn-sm btn-danger" data-action="q-delete" data-exam="${ex.id}" data-id="${q.id}" ${locked ? 'disabled' : ''}>${I('trash')}Remove</button>
    </div></li>`).join('')}</ol>`;
}
function vExam(id) {
  const ex = byId(S.exams, id); if (!ex) return notFound('This examination no longer exists.', 'teacher/exams');
  const locked = ex.status === 'active' || ex.status === 'completed';

  return `${backLink('#teacher/exams', 'All examinations')}
  <div class="page-head"><div class="grow"><p class="small muted">Examination · section ${ex.target}</p><h1>${esc(ex.title)}</h1></div>${badge(dStatus('exam', ex))}</div>
  <div class="btn-row">${itemActions('exam', ex)}</div>
  ${locked ? notice('warn', 'Questions are locked while this exam is active or completed.') : ''}
  <div class="grid two">

}

/* -- Sessions -- */
function sessionCard(s) {
  const st = eff(s);
  return `<article class="card"><div class="card-head"><div><p class="xs muted">${s.refType === 'exam' ? 'Examination' : 'Activity'} · ${s.target}</p><h3><a href="#teacher/session/${s.id}">${esc(s.title)}</a></h3></div>${badge(st)}</div>
  <div class="row-between"><span class="code">${s.code}</span><button type="button" class="btn btn-sm" data-action="copy-code" data-code="${s.code}">${I('copy')}Copy</button></div>
  <p class="small muted mt">${s.joined.length} joined · ${st === 'ended' ? 'Ended ' + rel(s.endedAt) : st === 'expired' ? 'Expired' : 'Expires ' + rel(s.expiresAt)}</p></article>`;
}
function vSessions() {
  const counts = ['ready', 'live', 'paused', 'ended'].map(k => [k, S.sessions.filter(s => eff(s) === k).length]);
  const addBtn = `<button type="button" class="btn btn-primary" data-action="new-session">${I('plus')}New session</button>`;
  return `<div class="toolbar"><div class="chips grow">${counts.map(([k, n]) => `<span class="badge b-muted">${STATUS[k][0]} <b class="mono">${n}</b></span>`).join('')}</div>${addBtn}</div>

}

  const s = byId(S.sessions, id); if (!s) return notFound('This session no longer exists.', 'teacher/sessions');

  const responded = roster.filter(x => subs.some(y => y.studentId === x.id)).length;

    return `<tr><td data-label="Student" class="cell-main">${esc(x.name)}</td>
      <td data-label="Joined">${badge(j ? 'joined' : 'notjoined')}</td>
      <td data-label="Response">${mine ? badge(s.refType === 'exam' ? 'submitted' : mine.status) : badge('waiting')}</td>
      <td data-label="Score" class="mono">${mine && mine.type === 'exam' ? `${mine.score}/${mine.total} · ${mine.percent}%` : '—'}</td></tr>`;

  <div class="page-head"><div class="grow"><p class="small muted">${s.refType === 'exam' ? 'Examination' : 'Activity'} · section ${s.target}</p><h1>${esc(s.title)}</h1></div>${badge(st)}</div>
  ${notice('warn', '<strong>Simulated session.</strong> Joins, submissions, and status changes are simulated in this browser. No real Wi-Fi clients are connected to an ESP32-S3.')}
  <div class="btn-row">${controls.join('')}</div>
  <div class="grid two">
    ${card('Join information', `<div class="join-box"><p class="xs muted">Session code</p><p class="code code-lg">${s.code}</p><button type="button" class="btn btn-sm" data-action="copy-code" data-code="${s.code}">${I('copy')}Copy code</button></div>
      <ol class="steps"><li>Open SNTCH on the Android student app.</li><li>Choose Join session and enter the code.</li><li>Wait for your teacher to start the session.</li></ol>
      <div class="qr-box" role="img" aria-label="QR placeholder. This is not a scannable code."><span>QR placeholder</span></div>
      <p class="xs muted">Decorative placeholder. It does not encode this session and cannot be scanned.</p>
      <p class="small muted mt">${ended ? 'Session closed.' : `Expires ${rel(s.expiresAt)} (${fdt(s.expiresAt)}).`}</p>`)}
    ${card('Live summary (simulated)', `<div class="mini-stats"><div><span class="xs muted">Joined</span><b class="mono">${joinedN}/${roster.length}</b></div><div><span class="xs muted">Responded</span><b class="mono">${responded}</b></div><div><span class="xs muted">Average</span><b class="mono">${avg === null ? '—' : avg + '%'}</b></div></div>
      <p class="small muted mt">Responded, of joined students</p>${bar(pct, 'Responded of joined students')}
      <p class="xs muted mt">Started ${fdt(s.startedAt)}${s.pausedAt ? ' · Paused ' + rel(s.pausedAt) : ''}${s.endedAt ? ' · Ended ' + rel(s.endedAt) : ''}</p>
      ${!ended ? (studentsIn(s.target).length ? `<div class="btn-row mt"><button type="button" class="btn btn-sm" data-action="sim-join" data-id="${s.id}">${I('users')}Simulate a join</button><button type="button" class="btn btn-sm" data-action="sim-submit" data-id="${s.id}" ${s.state === 'live' ? '' : 'disabled'}>${I('check')}Simulate a response</button></div><p class="xs muted mt">Simulated actions create sample records in this browser.</p>` : '<p class="xs muted mt">No students in this section yet. Simulated joins and responses become available once students are added.</p>') : ''}`)}
  </div>

}

/* -- Attendance -- */
function attList(roster, key) {
  const q = U.attQ.trim().toLowerCase();
  const rows = roster.filter(s => !q || (s.name + ' ' + s.number).toLowerCase().includes(q));
  if (!rows.length) return empty('users', 'No students match', 'Clear the search to see the whole section.');
  return rows.map(s => {
    const st = attStatusOf(s, key);
    return `<div class="att-row"><div class="grow"><p class="strong">${esc(s.name)}</p><p class="xs mono muted">${s.number}</p></div>
    <div class="att-seg" role="group" aria-label="Attendance for ${esc(s.name)}">
      ${['present', 'late', 'absent'].map(v => `<button type="button" data-action="att-set" data-id="${s.id}" data-val="${v}" data-key="${key}" aria-pressed="${st === v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}
    </div></div>`;
  }).join('');
}
function vAttendance() {
  const key = U.attDate || dayKey(Date.now()), roster = studentsIn(U.attSec), c = attCounts(U.attSec, key);
  const hist = Object.keys(S.attendance).filter(k => S.attendance[k][U.attSec]).sort().reverse().slice(0, 7);
  return `<div class="toolbar">
    <select class="select" data-change="att-sec" aria-label="Section">${secOpts(U.attSec)}</select>
    <input class="input" type="date" data-change="att-date" aria-label="Attendance date" value="${key}">
    <div class="search-field grow">${I('search')}<input class="input" type="search" data-input="att-q" aria-label="Search students" placeholder="Search students" value="${esc(U.attQ)}" autocomplete="off"></div></div>
  <div class="grid stats">${stat('check', 'Present', c.present, 'Marked')}${stat('clock', 'Late', c.late, 'Marked')}${stat('x', 'Absent', c.absent, 'Marked')}${stat('minus', 'Not marked', c.unmarked, 'Waiting for a mark')}</div>
  <div class="btn-row">
    <button type="button" class="btn btn-sm" data-action="att-fill" data-date="${key}">${I('check')}Mark unmarked as ${S.settings.defaultMark}</button>
    <button type="button" class="btn btn-sm btn-danger" data-action="att-clear" data-date="${key}">${I('refresh')}Clear section marks</button>
    <button type="button" class="btn btn-sm" data-action="att-export" data-date="${key}">${I('download')}Export CSV</button></div>
  <div class="grid two">
    ${card(`Roster · section ${U.attSec} · ${key}`, `<div id="att-list">${attList(roster, key)}</div>`)}
    ${card('Recent history', hist.length ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Present</th><th>Late</th><th>Absent</th><th>Rate</th></tr></thead><tbody>${hist.map(k => { const h = attCounts(U.attSec, k), m = attMarkedCount(h); return `<tr><td data-label="Date" class="cell-main mono">${k}</td><td data-label="Present">${h.present}</td><td data-label="Late">${h.late}</td><td data-label="Absent">${h.absent}</td><td data-label="Rate" class="mono">${m ? Math.round((h.present + h.late) / m * 100) : 0}%</td></tr>`; }).join('')}</tbody></table></div>` : empty('calendar', 'No history yet', 'Saved attendance dates appear here.'))}
  </div>`;
}

/* -- Results and history -- */
function resultRows() {
  let rows = S.submissions.filter(x => x.type === 'exam');
  if (U.resExam !== 'all') rows = rows.filter(x => x.refId === U.resExam);
  if (U.resStatus === 'passed') rows = rows.filter(x => x.passed);
  if (U.resStatus === 'failed') rows = rows.filter(x => !x.passed);
  if (U.resStatus === 'timeout') rows = rows.filter(x => x.timeout);
  const q = U.resQ.trim().toLowerCase();
  if (q) rows = rows.filter(x => ((studentById(x.studentId) || {}).name || '').toLowerCase().includes(q));
  const sorters = {
    recent: (a, b) => b.submittedAt - a.submittedAt, high: (a, b) => b.percent - a.percent, low: (a, b) => a.percent - b.percent,
    name: (a, b) => ((studentById(a.studentId) || {}).name || '').localeCompare((studentById(b.studentId) || {}).name || '')
  };
  return rows.sort(sorters[U.resSort] || sorters.recent);
}
function resultRow(x) {
  const st = studentById(x.studentId) || {};
  return `<tr><td data-label="Student" class="cell-main">${esc(st.name || 'Unknown')}<span class="xs muted mono">${st.number || ''}</span></td>
  <td data-label="Exam">${esc(itemTitle('exam', x.refId))}</td>
  <td data-label="Score" class="mono">${x.score}/${x.total}</td>
  <td data-label="Percent" class="mono">${x.percent}%</td>
  <td data-label="Status">${badge(x.passed ? 'passed' : 'failed')}${x.timeout ? ' <span class="badge b-warn">Timed out</span>' : ''}</td>
  <td data-label="Completed" class="mono xs">${fdt(x.submittedAt)}</td>
  <td class="actions"><button type="button" class="btn btn-sm" data-action="result-detail" data-id="${x.id}">${I('eye')}Details</button></td></tr>`;
}
function distribution(rows) {
  const b = [[0, 19, '0–19'], [20, 39, '20–39'], [40, 59, '40–59'], [60, 79, '60–79'], [80, 100, '80–100']];
  const counts = b.map(([lo, hi]) => rows.filter(x => x.percent >= lo && x.percent <= hi).length);
  const max = Math.max(1, ...counts);
  return `<div class="dist" role="img" aria-label="Score distribution: ${b.map((r, i) => `${r[2]} percent, ${counts[i]} results`).join('; ')}">${b.map((r, i) => `<div class="dist-col"><span class="mono xs">${counts[i]}</span><div class="dist-bar" style="height:${Math.round(counts[i] / max * 100)}%"></div><span class="xs muted">${r[2]}</span></div>`).join('')}</div>`;
}
function pastSessions() {
  const ended = S.sessions.filter(s => s.state === 'ended');
  if (!ended.length) return empty('radio', 'No past sessions', 'Ended sessions and their summaries appear here.');
  return `<ul class="list">${ended.map(s => {
    const subs = S.submissions.filter(x => x.sessionId === s.id), ex = subs.filter(x => x.type === 'exam');
    const avg = ex.length ? Math.round(ex.reduce((a, b) => a + b.percent, 0) / ex.length) : null;
    return `<li class="list-item"><div class="grow"><a class="strong" href="#teacher/session/${s.id}">${esc(s.title)}</a><div class="small muted">${s.joined.length} joined · ${subs.length} responses · ended ${rel(s.endedAt)}</div></div><span class="mono small">${avg === null ? '—' : avg + '% avg'}</span></li>`;
  }).join('')}</ul>`;
}
function resultsArea() {
  const rows = resultRows(), all = S.submissions.filter(x => x.type === 'exam');
  return `<div class="grid two">${card('Score distribution', distribution(rows), `<span class="xs muted">${rows.length} of ${all.length} shown</span>`)}${card('Past sessions', pastSessions())}</div>
  ${card('Exam results', rows.length ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Student</th><th>Exam</th><th>Score</th><th>%</th><th>Status</th><th>Completed</th><th><span class="sr-only">Details</span></th></tr></thead><tbody>${rows.map(resultRow).join('')}</tbody></table></div>` : empty('trophy', 'No results match', 'Change the filters or search, or wait for submissions.'))}`;
}
function vResults() {
  const exOpts = [['all', 'All examinations'], ...S.exams.map(e => [e.id, e.title])];
  return `<div class="toolbar">
    <div class="search-field grow">${I('search')}<input class="input" type="search" data-input="res-q" aria-label="Search by student" placeholder="Search by student name" value="${esc(U.resQ)}" autocomplete="off"></div>
    <select class="select" data-change="res-exam" aria-label="Examination">${opts(exOpts, U.resExam)}</select>
    <select class="select" data-change="res-status" aria-label="Status">${opts([['all', 'Any status'], ['passed', 'Passed'], ['failed', 'Failed'], ['timeout', 'Timed out']], U.resStatus)}</select>
    <select class="select" data-change="res-sort" aria-label="Sort">${opts([['recent', 'Newest first'], ['high', 'Highest percent'], ['low', 'Lowest percent'], ['name', 'Name A–Z']], U.resSort)}</select>
    <button type="button" class="btn" data-action="res-export">${I('download')}Export CSV</button></div>
  <div id="res-area">${resultsArea()}</div>`;
}

/* -- Device and network (all readings simulated) -- */
function diagChecks() {
  const d = S.device, n = connectedClients(), cap = S.settings.capacity, age = Date.now() - d.lastSync;
  return [
    { label: 'Controller reachable', res: d.status === 'connected' || d.status === 'syncing' ? 'pass' : 'fail', note: `Status: ${STATUS[d.status][0]} (simulated)` },
    { label: 'Access point broadcasting', res: d.status === 'connected' ? 'pass' : d.status === 'syncing' ? 'warn' : 'fail', note: d.ssid ? `Network ${d.ssid}, channel ${d.channel}` : 'No network configured yet' },
    { label: 'Clients within target capacity', res: n > cap ? 'fail' : n > cap * 0.9 ? 'warn' : 'pass', note: `${n} of ${cap} target (not a verified limit)` },
    { label: 'Storage headroom', res: d.storage >= 95 ? 'fail' : d.storage >= 85 ? 'warn' : 'pass', note: `${d.storage}% used (simulated)` },
    { label: 'Last synchronization', res: age > 30 * MIN ? 'fail' : age > 10 * MIN ? 'warn' : 'pass', note: d.lastSync ? `Last sync ${rel(d.lastSync)}` : 'No sync recorded yet' },
    { label: 'Optional TFT display', res: 'na', note: 'Hardware not defined. Not required for classroom use.' },
    { label: 'Physical buttons and buzzer', res: 'na', note: 'Planned hardware. Not configurable from the browser.' }
  ];
}

/* ===== 10. Teacher lifecycle: sessions and items ===== */
function setSessionState(s, to) {
  const from = s.state, now = Date.now();
  const allowed = { ready: ['live', 'ended'], live: ['paused', 'ended'], paused: ['live', 'ended'], ended: [] };
  if (!(allowed[from] || []).includes(to)) { toast(`A ${STATUS[from][0].toLowerCase()} session cannot move to ${STATUS[to][0].toLowerCase()}.`, 'error'); return false; }
  if (to === 'live' && eff(s) === 'expired') { toast('This session has expired. Create a new session.', 'error'); return false; }
  s.state = to;
  if (to === 'live' && !s.startedAt) s.startedAt = now;
  if (to === 'live') s.pausedAt = null;
  if (to === 'paused') s.pausedAt = now;
  if (to === 'ended') { s.endedAt = now; s.pausedAt = null; }
  const item = getItem(s.refType, s.refId);
  if (item) { if (to === 'live') item.status = 'active'; if (to === 'ended') item.status = 'completed'; }
  const verb = to === 'live' ? (from === 'paused' ? 'resumed' : 'started') : to === 'paused' ? 'paused' : 'ended';
  logEvent(`Session ${s.code} ${verb}`, to === 'ended' ? 'info' : to === 'paused' ? 'warn' : 'ok');
  return true;
}
function createSession({ refType, refId, title, expiryMin, startNow }) {
  const item = getItem(refType, refId), now = Date.now();
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let code;
  do { code = 'SNT-' + Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join(''); } while (S.sessions.some(x => x.code === code));
  const s = { id: uid('ses'), code, title: title || item.title, refType, refId, target: item.target, state: startNow ? 'live' : 'ready', createdAt: now, startedAt: startNow ? now : null, pausedAt: null, endedAt: null, expiresAt: now + expiryMin * MIN, joined: [] };
  S.sessions.unshift(s);
  item.status = startNow ? 'active' : 'scheduled';
  logEvent(`Session ${code} created for ${s.title}`);
  return s;
}
function itemStart(type, id) {
  const it = getItem(type, id); if (!it) return;
  if (it.status === 'draft') return toast('Schedule or publish this before starting a session.', 'warn');
  if (it.status === 'completed') return toast('This item is closed. Create a new one to run it again.', 'warn');
  if (sessionOpenFor(type, id)) return toast('A session is already open for this item.', 'info');
  if (type === 'exam' && !it.questions.length) return toast('Add at least one question first.', 'error');
  const s = createSession({ refType: type, refId: id, expiryMin: type === 'exam' ? it.duration + 30 : 120, startNow: true });
  toast(`Session ${s.code} is live.`);
  commit();
}
function itemPause(type, id) {
  const s = sessionOpenFor(type, id); if (!s) return;
  setSessionState(s, s.state === 'paused' ? 'live' : 'paused');
  commit();
}
function itemClose(type, id) {
  const it = getItem(type, id), s = sessionOpenFor(type, id);
  confirmBox({
    title: `Close ${type === 'exam' ? 'examination' : 'activity'}?`,
    message: `Closing "${esc(it.title)}" ends its session. Students still answering are submitted automatically (simulated).`,
    action: 'Close', danger: true,
    onYes: () => { if (s) setSessionState(s, 'ended'); else it.status = 'completed'; commit(); }
  });
}
function itemDelete(type, id) {
  const it = getItem(type, id);
  if (sessionOpenFor(type, id)) return toast('Close the open session before deleting.', 'error');
  if (S.attempt && S.attempt.status === 'in-progress' && S.attempt.examId === id) return toast('A student has an exam in progress for this item.', 'error');
  confirmBox({
    title: `Delete ${type === 'exam' ? 'examination' : 'activity'}?`,
    message: `"${esc(it.title)}" and its submissions will be removed from this browser.`,
    action: 'Delete', danger: true,
    onYes: () => {
      if (type === 'exam') S.exams = S.exams.filter(x => x.id !== id); else S.activities = S.activities.filter(x => x.id !== id);
      S.submissions = S.submissions.filter(x => !(x.type === type && x.refId === id));
      const gone = S.sessions.filter(s => s.refType === type && s.refId === id).map(s => s.id);
      S.sessions = S.sessions.filter(s => !gone.includes(s.id));
      if (gone.includes(S.student.studentSession)) S.student.studentSession = null;
      const onDetail = routeIs('teacher', type === 'exam' ? 'exam' : 'activity') && route().id === id;
      logEvent(`Deleted: ${it.title}`, 'warn');
      if (onDetail) location.hash = type === 'exam' ? '#teacher/exams' : '#teacher/activities';
      commit(); toast('Deleted from this browser.');
    }
  });
}
function publishExam(id) {
  const ex = byId(S.exams, id); if (!ex) return;
  if (!ex.questions.length) return toast('Add at least one question before publishing.', 'error');
  confirmBox({
    title: 'Publish examination?',
    message: `"${esc(ex.title)}" becomes Scheduled and can be started in a session. You can still edit settings until it is active.`,
    action: 'Publish',
    onYes: () => { ex.status = 'scheduled'; logEvent(`Published: ${ex.title}`); commit(); toast('Examination published.'); }
  });

  const body = type === 'exam'

    : `<p class="pre">${esc(it.instructions)}</p><p class="small muted mt">Due ${fdt(it.dueAt)}</p>`;
  openModal({ title: `Preview: ${esc(it.title)}`, large: true, body: `<p class="xs muted">Preview of what students see. Answer keys are visible only to teachers.</p>${body}`, foot: '<button type="button" class="btn btn-primary" data-action="modal-close">Close</button>' });

/* ===== 11. Shared review rendering (teacher and student) ===== */
function reviewRows(ex, answers, showKey = true) {
  return ex.questions.map((q, j) => {
    const a = answers[q.id], unanswered = a === undefined || a === '';
    const ok = !unanswered && (q.type === 'mc' ? a === q.correct : q.keys.some(k => k.toLowerCase() === String(a).trim().toLowerCase()));
    const shown = unanswered ? 'No answer' : q.type === 'mc' ? q.options[a] : a;
    const key = q.type === 'mc' ? q.options[q.correct] : q.keys.join(' / ');
    return `<div class="review-row"><span class="xs muted">Question ${j + 1}</span><p class="strong">${esc(q.prompt)}</p><p class="small">Answer: ${esc(shown)} ${badge(ok ? 'pass' : 'fail')}</p>${showKey ? `<p class="xs muted">Correct answer: ${esc(key)}</p>` : ''}</div>`;
  }).join('');
}
function openExamReview(x, teacherView) {
  const ex = byId(S.exams, x.refId), st = studentById(x.studentId);
  const showKey = teacherView || S.settings.showCorrect;
  openModal({
    title: esc(ex ? ex.title : 'Examination'), large: true,
    body: `<p class="small">${teacherView && st ? esc(st.name) + ' · ' : ''}Score <b class="mono">${x.score}/${x.total}</b> · <b class="mono">${x.percent}%</b> ${badge(x.passed ? 'passed' : 'failed')}</p>

}

        ${[0, 1, 2, 3].map(j => `<div class="opt-edit"><input type="radio" name="correct" value="${j}" aria-label="Option ${'ABCD'[j]} is correct" ${q && q.correct === j ? 'checked' : ''}><span class="opt-letter">${'ABCD'[j]}</span><input class="input" name="opt${j}" aria-label="Option ${'ABCD'[j]}" value="${esc(o[j] || '')}" maxlength="120"></div>`).join('')}
        <p class="hint">Four options. Options must be different from each other.</p></fieldset>`
      : `<label class="field"><span class="label">Accepted answers</span><input class="input" name="keys" value="${esc(q ? q.keys.join(', ') : '')}" maxlength="160"><span class="hint">Separate with commas. Matching ignores capital letters.</span></label>`}
    </form>`,
    foot: `<button type="button" class="btn" data-action="modal-close">Cancel</button><button type="submit" class="btn btn-primary" form="question-form">Save question</button>`
  });
}

FORMS.question = f => {
  const d = formData(f), ex = byId(S.exams, d.exId); if (!ex) return;
  if (!validate(f, [{ name: 'prompt', req: 'Write the question text.', max: 200 }])) return;
  let q;
  if (d.type === 'mc') {
    const opts4 = [0, 1, 2, 3].map(j => (d['opt' + j] || '').trim());
    let bad = false;
    opts4.forEach((t, j) => { if (!t && !bad) { bad = true; showErr(f, 'opt' + j, 'Enter this option.'); } });
    if (bad) return;
    if (new Set(opts4.map(t => t.toLowerCase())).size < 4) return toast('Options must be different from each other.', 'error');
    if (d.correct === undefined) return toast('Choose the correct option.', 'error');
    q = { id: d.qid || uid('q'), type: 'mc', prompt: d.prompt.trim(), options: opts4, correct: Number(d.correct) };
  } else {
    const keys = (d.keys || '').split(',').map(x => x.trim()).filter(Boolean);
    if (!keys.length) return showErr(f, 'keys', 'Add at least one accepted answer.');
    q = { id: d.qid || uid('q'), type: 'text', prompt: d.prompt.trim(), keys };
  }
  if (d.qid) { const idx = ex.questions.findIndex(x => x.id === d.qid); ex.questions[idx] = q; } else ex.questions.push(q);
  closeModal(false); commit(); toast('Question saved.');
};

  const s = byId(S.sessions, el.dataset.id); if (!s || s.state === 'ended') return;
  const pool = studentsIn(s.target).filter(x => !s.joined.includes(x.id));
  if (!pool.length) return toast('Everyone in this section has joined.', 'info');
  const pick = pool[Math.floor(Math.random() * pool.length)];
  s.joined.push(pick.id); logEvent(`[Simulated] ${pick.name} joined ${s.code}`); commit();
  toast(`Simulated join: ${pick.name}`, 'info');

ACTIONS['sim-submit'] = el => {
  const s = byId(S.sessions, el.dataset.id); if (!s) return;
  if (s.state !== 'live') return toast('Simulated responses need a live session.', 'warn');
  const pool = s.joined.filter(id => !S.submissions.some(x => x.sessionId === s.id && x.studentId === id));
  if (!pool.length) return toast('No joined students are waiting to respond.', 'info');
  const id = pool[0], k = Math.max(0, studentsIn(s.target).findIndex(x => x.id === id));
  if (s.refType === 'exam') S.submissions.unshift(mkExamSub(getItem('exam', s.refId), id, s.id, k, Date.now()));
  else S.submissions.unshift(mkActSub(getItem('activity', s.refId), id, s.id, k, Date.now(), 'pending'));
  logEvent(`[Simulated] response from ${studentById(id).name} in ${s.code}`); commit();
  toast('Simulated response added.', 'info');
};

CHANGES.setting = el => {
  const key = el.dataset.setting;
  let val = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value;
  if (el.type === 'number') {
    const min = Number(el.min), max = Number(el.max);
    if (!(val >= min && val <= max)) { toast(`Use a value from ${min} to ${max}.`, 'error'); el.value = S.settings[key]; return; }
  }
  S.settings[key] = val;

/* ===== 14. Student views ===== */
const STUDENT_VIEWS = { home: vHome, join: vJoin, scan: vSScan, activity: vSActivity, exam: vSExam, results: vSResults, profile: vProfile };
const currentSession = () => S.student.studentSession ? byId(S.sessions, S.student.studentSession) : null;

const nextCard = (kicker, titleHTML, subHTML, ctaHTML) => `<section class="feature" aria-label="Next step"><p class="xs">${kicker}</p><h2>${titleHTML}</h2>${subHTML ? `<p class="small">${subHTML}</p>` : ''}${ctaHTML}</section>`;
const ctaLink = (href, label, ghost = false) => `<a class="btn btn-sm ${ghost ? 'btn-ghost-light' : ''}" href="${href}">${label}</a>`;
const ctaButton = (action, label, id = '') => `<button type="button" class="btn btn-sm" data-action="${action}" ${id ? `data-id="${id}"` : ''}>${label}</button>`;
function connectionChip() {
  const d = S.device;

const itemCardS = x => `<li class="item-card"><div class="grow"><span class="tag-type">${x.type === 'exam' ? 'Examination' : 'Activity'}</span><h3>${esc(x.title)}</h3><p class="small muted">${x.dueAt ? 'Due ' + fdt(x.dueAt) : 'No due date'}</p></div>${badge(x.status)}<a class="btn btn-sm" href="#student/${x.type}/${x.id}">Open</a></li>`;
const resultItemS = x => `<li class="item-card"><div class="grow"><span class="tag-type">${x.type === 'exam' ? 'Examination' : 'Activity'}</span><h3>${esc(itemTitle(x.type === 'exam' ? 'exam' : 'activity', x.refId))}</h3><p class="small muted">${fdt(x.submittedAt)}</p></div>${x.type === 'exam' ? `<span class="mono strong">${x.percent}%</span>${badge(x.passed ? 'passed' : 'failed')}` : badge(x.status)}<button type="button" class="btn btn-sm" data-action="result-detail" data-id="${x.id}">Details</button></li>`;

function sessionNext(s) {
  const st = eff(s), isExam = s.refType === 'exam';
  if (st === 'live') {

    if (done) return nextCard(`Joined ${s.code}`, esc(s.title), 'You have already submitted this. Waiting for your teacher.', ctaLink('#student/results', 'View results', true));
    return nextCard(`Joined ${s.code} · live`, esc(s.title), `${isExam ? 'Examination' : 'Activity'} is open now.`, ctaLink(isExam ? `#student/exam/${s.refId}` : `#student/activity/${s.refId}`, isExam ? 'Start exam' : 'Open activity'));
  }

function vHome() {
  const st = me(), sess = currentSession(), att = S.attempt && S.attempt.status === 'in-progress' ? S.attempt : null;
  const h = new Date().getHours(), greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  const items = [...S.exams.map(e => ({ ...e, type: 'exam' })), ...S.activities.map(a => ({ ...a, type: 'activity' }))]
    .filter(x => st && x.target === st.section && (x.status === 'active' || x.status === 'scheduled'));
  const mine = st ? S.submissions.filter(x => x.studentId === st.id).slice(0, 3) : [];

  else if (sess) next = sessionNext(sess);

function joinPreviewCard(s) {

}
function vJoin() {
  const cur = currentSession(), msg = U.joinMsg, prev = U.joinPreview ? byId(S.sessions, U.joinPreview) : null;
  return `<div class="hello"><h1>Join a session</h1><p class="small muted">Enter the code from your teacher. Codes are checked against this classroom's sessions.</p></div>
  ${cur ? notice('info', `You are in <b class="mono">${esc(cur.code)}</b> (${esc(cur.title)}). Leave it before joining another session.<div class="btn-row mt">${ctaButton('session-leave', 'Leave session')}</div>`) : ''}
  <section class="card"><form data-form="join" novalidate>
    <label class="field"><span class="label">Session code</span><input class="input mono" name="code" id="join-code" placeholder="SNT-XXXX" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false" value="${esc(U.joinCode)}"><span class="hint">Format: SNT- followed by four characters.</span></label>
    <button type="submit" class="btn btn-primary btn-lg">Check code</button>
  </form>
  ${msg ? `<div class="mt">${notice(msg.tone, esc(msg.text))}</div>` : ''}
</section>

FORMS.join = f => {
  const code = String(formData(f).code || '').trim().toUpperCase(), st = me();
  U.joinCode = code; U.joinPreview = null; U.focusSel = '#join-code';
  const fail = text => { U.joinMsg = { tone: 'bad', text }; render(); };
  if (!/^SNT-[A-Z0-9]{4}$/.test(code)) return fail('Codes look like SNT-XXXX. Check the code with your teacher.');
  if (S.device.status === 'disconnected' || S.device.status === 'unavailable') return fail('Cannot reach the SNTCH controller (simulated). Check the classroom Wi-Fi and try again.');
  const s = S.sessions.find(x => x.code === code);
  if (!s) return fail('No session matches this code. Check the board or ask your teacher.');
  if (s.state === 'ended') return fail('This session has ended. Ask your teacher for a new code.');
  if (eff(s) === 'expired') return fail('This code has expired. Ask your teacher for a new one.');
  if (st && s.target !== st.section) return fail(`This session is for section ${s.target}. Your section is ${st.section}.`);
  U.joinMsg = null; U.joinPreview = s.id; render();
};

/* Activity response */
function vSActivity(id) {
  const a = byId(S.activities, id); if (!a) return notFound('This activity is no longer available.', 'student/home');
  const st = me(), sess = S.sessions.find(s => s.refType === 'activity' && s.refId === a.id && s.state !== 'ended');
  const mine = S.submissions.find(x => x.type === 'activity' && x.refId === a.id && x.studentId === (st ? st.id : null));
  let body;
  if (st && a.target !== st.section) body = notice('bad', 'This activity is for another section.');
  else if (mine) body = `${notice('ok', mine.status === 'reviewed' ? 'Your teacher reviewed your response.' : 'Submitted. Waiting for your teacher to review it.')}<div class="card mt"><p class="xs muted">Your response · ${fdt(mine.submittedAt)}</p><p class="pre mt">${esc(mine.text)}</p><p class="mt">${badge(mine.status)}</p></div>`;
  else if (!sess || a.status === 'completed') body = notice('info', 'Your teacher has not opened this activity, or it has closed.');
  else if (S.student.studentSession !== sess.id) body = notice('warn', `Join session <b class="mono">${esc(sess.code)}</b> first.<div class="btn-row mt">${ctaLink('#student/join', 'Join a session')}</div>`);
  else if (sess.state !== 'live') body = notice('warn', sess.state === 'paused' ? 'Paused by your teacher. You can submit once it resumes.' : 'Waiting for your teacher to start the session.');
  else body = `<form data-form="activity-response" novalidate><input type="hidden" name="aid" value="${a.id}">
    <label class="field"><span class="label">Your response</span><textarea class="textarea" name="text" rows="6" maxlength="500" data-input="resp-text" placeholder="Type your response here"></textarea><span class="hint" id="resp-count">0 / 500 characters</span></label>
    <button type="submit" class="btn btn-primary btn-lg">Review and submit</button></form>`;
  return `${backLink('#student/home', 'Home')}<section class="card"><span class="tag-type">Activity</span><h1>${esc(a.title)}</h1><p class="small muted mt">${esc(a.description)}</p><h3 class="mt">Instructions</h3><p class="pre mt">${esc(a.instructions)}</p><p class="xs muted mt">Due ${fdt(a.dueAt)}</p></section>
  <section class="card mt">${body}</section>`;
}
INPUTS['resp-text'] = el => { const c = $('#resp-count'); if (c) c.textContent = `${el.value.length} / 500 characters`; };
FORMS['activity-response'] = f => {
  const d = formData(f), text = String(d.text || '').trim();
  if (text.length < 10) return showErr(f, 'text', 'Write at least 10 characters.');
  const a = byId(S.activities, d.aid), sess = currentSession();
  confirmBox({
