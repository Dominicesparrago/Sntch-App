    onYes: () => {
      S.submissions.unshift({ id: uid('sub'), type: 'activity', refId: a.id, sessionId: sess ? sess.id : null, studentId: S.student.id, text, submittedAt: Date.now(), status: 'pending' });
      logEvent(`${S.student.displayName} submitted ${a.title}`); commit(); toast('Response submitted.');
    }
  });
};

/* Examination: gated by a live joined session, timed, answers kept per question */
function vSExam(id) {
  const ex = byId(S.exams, id); if (!ex) return notFound('This examination is no longer available.', 'student/home');
  const att = S.attempt, mine = S.submissions.find(x => x.type === 'exam' && x.refId === id && x.studentId === S.student.id);
  if (att && att.examId === id && att.status === 'in-progress') return takeView(ex, att);
  if (att && att.status === 'in-progress') return notice('warn', `You have another exam in progress: <b>${esc(itemTitle('exam', att.examId))}</b>. Finish it first.<div class="btn-row mt">${ctaLink(`#student/exam/${att.examId}`, 'Resume exam')}</div>`);
  if (mine) return `${backLink('#student/home', 'Home')}${resultView(ex, mine, att && att.examId === id ? att : null)}`;
  return preStart(ex);
}
function preStart(ex) {
  const s = currentSession(), ok = s && s.refType === 'exam' && s.refId === ex.id;
  let msg = '', can = false;
  if (ok && s.state === 'live') can = true;
  else if (ok && s.state === 'paused') msg = 'Paused by your teacher. The button unlocks when the session resumes.';
  else if (ok) msg = 'Waiting for your teacher to start the session.';
  else if (s) msg = `You are in ${esc(s.code)}, which is not this exam. Leave that session to join this one.`;
  else msg = 'Join this exam’s session first. Ask your teacher for the code.';
  return `${backLink('#student/home', 'Home')}<section class="card">
    <span class="tag-type">Examination</span><h1>${esc(ex.title)}</h1><p class="pre mt small">${esc(ex.instructions)}</p>
    <dl class="facts"><div><dt>Duration</dt><dd class="mono">${ex.duration} min</dd></div><div><dt>Questions</dt><dd class="mono">${ex.questions.length}</dd></div><div><dt>Passing score</dt><dd class="mono">${ex.passing}%</dd></div><div><dt>Attempts</dt><dd>${ex.attempts}</dd></div></dl>
    ${msg ? `<div class="mt">${notice(can ? 'ok' : 'info', msg)}</div>` : ''}
    <div class="btn-row mt"><button type="button" class="btn btn-primary btn-lg" data-action="exam-start" data-id="${ex.id}" ${can ? '' : 'disabled'}>Start exam</button>${s ? '' : ctaLink('#student/join', 'Join a session', true)}</div>
    <p class="xs muted mt">Timing here is a browser simulation. It is not secure exam enforcement.</p></section>`;
}
const answeredCount = (ex, att) => ex.questions.filter(q => att.answers[q.id] !== undefined && att.answers[q.id] !== '').length;
function qnavHTML(ex, att, cur) {
  return ex.questions.map((q, j) => {
    const done = att.answers[q.id] !== undefined && att.answers[q.id] !== '';
    return `<button type="button" class="${done ? 'answered' : ''}" data-action="exam-go" data-idx="${j}" aria-label="Question ${j + 1}, ${done ? 'answered' : 'not answered'}" ${j === cur ? 'aria-current="step"' : ''}>${j + 1}${done ? I('check', 'sm-ico') : ''}</button>`;
  }).join('');
}
function takeView(ex, att) {
  if (att.review) return reviewView(ex, att);
  const n = ex.questions.length, idx = Math.min(att.index, n - 1), q = ex.questions[idx], s = byId(S.sessions, att.sessionId);
  const val = att.answers[q.id];
  const input = q.type === 'mc'
    ? q.options.map((o, j) => `<label class="opt"><input type="radio" name="answer" value="${j}" data-answer="${q.id}" ${val === j ? 'checked' : ''}><span class="opt-letter">${'ABCD'[j]}</span><span>${esc(o)}</span></label>`).join('')
    : `<label class="field"><span class="label">Your answer</span><input class="input" name="answer" data-answer="${q.id}" value="${esc(val || '')}" maxlength="120" autocomplete="off" autocapitalize="off"></label>`;
  return `<div class="exam-top">
    <button type="button" class="icon-btn" data-action="exam-exit" aria-label="Leave this screen (timer keeps running)" title="Leave screen">${I('x')}</button>
    <div class="grow"><p class="xs muted">${esc(ex.title)}</p><p class="small strong">Question ${idx + 1} of ${n}</p></div>
    <span id="exam-timer" class="timer ${att.remaining < 60 ? 'low' : ''}" aria-label="Time remaining">${clockStr(att.remaining)}</span></div>
  <div class="exam-body">
    ${s && s.state === 'paused' ? notice('warn', 'Paused by your teacher. The timer is stopped until the session resumes.') : ''}
    ${bar(Math.round((idx + 1) / n * 100), 'Exam progress')}
    <nav class="qnav" id="qnav" aria-label="Questions">${qnavHTML(ex, att, idx)}</nav>
    <p class="xs muted" id="answered-count">${answeredCount(ex, att)} of ${n} answered</p>
    <section class="card qcard"><p class="xs muted">Question ${idx + 1} · ${q.type === 'mc' ? 'Choose one answer' : 'Short answer'}</p><h2 class="qprompt" id="q-heading" tabindex="-1">${esc(q.prompt)}</h2>${input}</section>
    <div class="exam-nav"><button type="button" class="btn" data-action="exam-go" data-idx="${idx - 1}" ${idx === 0 ? 'disabled' : ''}>Previous</button>
    ${idx < n - 1 ? `<button type="button" class="btn btn-primary" data-action="exam-go" data-idx="${idx + 1}">Next</button>` : '<button type="button" class="btn btn-primary" data-action="exam-review">Review answers</button>'}</div>
  </div>`;
}
function reviewView(ex, att) {
  const n = ex.questions.length, missing = [];
  ex.questions.forEach((q, j) => { const v = att.answers[q.id]; if (v === undefined || v === '') missing.push(j + 1); });
  return `<div class="exam-top"><button type="button" class="icon-btn" data-action="exam-go" data-idx="${n - 1}" aria-label="Back to questions">${I('chevron-left')}</button>
   <div class="grow"><p class="xs muted">${esc(ex.title)}</p><p class="small strong">Review before submitting</p></div><span id="exam-timer" class="timer ${att.remaining < 60 ? 'low' : ''}">${clockStr(att.remaining)}</span></div>
  <div class="exam-body">
    ${missing.length ? notice('warn', `${missing.length} unanswered: question${missing.length > 1 ? 's' : ''} ${missing.join(', ')}. Answer every question to submit.`) : notice('ok', 'All questions are answered. You can submit now.')}
    <ol class="review-list">${ex.questions.map((q, j) => { const v = att.answers[q.id], shown = v === undefined || v === '' ? 'No answer' : q.type === 'mc' ? q.options[v] : v; return `<li class="review-item"><div class="grow"><span class="xs muted">Question ${j + 1}</span><p class="strong">${esc(q.prompt)}</p><p class="small">${esc(shown)}</p></div><button type="button" class="btn btn-sm" data-action="exam-go" data-idx="${j}">Edit</button></li>`; }).join('')}</ol>
    <div class="exam-nav"><button type="button" class="btn" data-action="exam-go" data-idx="${n - 1}">Back to questions</button><button type="button" class="btn btn-primary" data-action="exam-submit" ${missing.length ? 'disabled' : ''}>Submit exam</button></div>
  </div>`;
}
function resultView(ex, sub, att) {
  let note = '';
  if (sub.timeout) note = notice('warn', att && att.endReason === 'ended' ? 'The session ended, so your answers were submitted automatically (simulated).' : 'Time is up. Your answers were submitted automatically (simulated timeout).');
  const review = S.settings.showCorrect ? reviewRows(ex, sub.answers, true) : notice('info', 'Correct answers are hidden by your teacher’s settings.');
  return `<section class="card result-hero"><span class="tag-type">${esc(ex.title)}</span><p class="small muted">Submitted ${fdt(sub.submittedAt)}</p>
    <p class="score-big">${sub.score}/${sub.total}</p><p class="mono">${sub.percent}%</p>${badge(sub.passed ? 'passed' : 'failed')}
    <p class="xs muted">Pass mark ${ex.passing}%. Answers are locked after submission.</p></section>
    ${note}<h2 class="section-title">Answer review</h2><section class="card">${review}</section>
    <div class="btn-row"><a class="btn btn-primary" href="#student/results">All results</a><a class="btn" href="#student/home">Home</a></div>`;
}
function onAnswer(el) {
  const att = S.attempt; if (!att || att.status !== 'in-progress') return;
  const ex = byId(S.exams, att.examId), q = ex && ex.questions.find(x => x.id === el.dataset.answer); if (!q) return;
  const v = q.type === 'mc' ? Number(el.value) : el.value;
  if (q.type === 'text' && String(v).trim() === '') delete att.answers[q.id]; else att.answers[q.id] = v;
  save();
  const nav = $('#qnav'); if (nav) nav.innerHTML = qnavHTML(ex, att, att.index);
  const c = $('#answered-count'); if (c) c.textContent = `${answeredCount(ex, att)} of ${ex.questions.length} answered`;
}
ACTIONS['exam-start'] = el => {
  const ex = byId(S.exams, el.dataset.id), s = currentSession();
  if (!ex || !s || s.state !== 'live') return toast('Join a live session first.', 'warn');
  if (S.attempt && S.attempt.status === 'in-progress') return toast('Finish your current exam first.', 'warn');
  confirmBox({
    title: 'Start exam?', message: `The ${ex.duration}-minute timer starts now and keeps running while the session is live. Once submitted, answers cannot change.`, action: 'Start exam',
    onYes: () => {
      S.attempt = { examId: ex.id, sessionId: s.id, remaining: ex.duration * 60, answers: {}, index: 0, review: false, status: 'in-progress', seenState: s.state, startedAt: Date.now() };
      logEvent(`${S.student.displayName} started ${ex.title}`); commit();
    }
  });
};
ACTIONS['exam-go'] = el => {
  const att = S.attempt; if (!att || att.status !== 'in-progress') return;
  att.index = Math.max(0, Number(el.dataset.idx)); att.review = false;
  U.focusSel = '#q-heading'; commit();
};
ACTIONS['exam-review'] = () => { if (S.attempt && S.attempt.status === 'in-progress') { S.attempt.review = true; commit(); } };
ACTIONS['exam-submit'] = () => {
  const att = S.attempt; if (!att || att.status !== 'in-progress') return;
  const ex = byId(S.exams, att.examId);
  if (answeredCount(ex, att) < ex.questions.length) return toast('Answer every question before submitting.', 'error');
  if (S.settings.confirmSubmit) return confirmBox({ title: 'Submit exam?', message: 'You cannot change your answers after submitting.', action: 'Submit exam', onYes: () => { submitAttempt('student'); commit(); } });
  submitAttempt('student'); commit();
};
ACTIONS['exam-exit'] = () => { toast('Exam still in progress. Resume it from Home.', 'info'); location.hash = '#student/home'; };
function submitAttempt(reason) {
  const att = S.attempt; if (!att || att.status !== 'in-progress') return;
  const ex = byId(S.exams, att.examId), g = grade(ex, att.answers);
  const sub = { id: uid('sub'), type: 'exam', refId: ex.id, sessionId: att.sessionId, studentId: S.student.id, answers: { ...att.answers }, score: g.score, total: g.total, percent: g.percent, passed: g.passed, submittedAt: Date.now(), timeout: reason !== 'student', status: 'graded' };
  S.submissions.unshift(sub);
  att.status = 'submitted'; att.endReason = reason; att.submissionId = sub.id;
  logEvent(`${S.student.displayName} submitted ${ex.title}${reason === 'student' ? '' : reason === 'timeout' ? ' (time up)' : ' (session ended)'}`);
  save();
  if (reason === 'student') toast('Exam submitted.');
  else toast(reason === 'timeout' ? 'Time is up. Answers submitted (simulated).' : 'Session ended. Answers submitted (simulated).', 'warn');
}
/* Global one-second tick: runs the exam clock only while the session is live. */
let tickN = 0;
function tick() {
  const att = S.attempt; if (!att || att.status !== 'in-progress') return;
  const s = byId(S.sessions, att.sessionId);
  if (!s || s.state === 'ended') { submitAttempt('ended'); if (routeIs('student', 'exam')) render(); return; }
  if (att.seenState !== s.state) { att.seenState = s.state; if (routeIs('student', 'exam')) render(); return; }
  if (s.state === 'live') {
    att.remaining = Math.max(0, att.remaining - 1);
    if (att.remaining === 0) { submitAttempt('timeout'); if (routeIs('student', 'exam')) render(); return; }
  }
  const t = $('#exam-timer'); if (t) { t.textContent = clockStr(att.remaining); t.classList.toggle('low', att.remaining < 60); }
  const hc = $('#home-clock'); if (hc) hc.textContent = clockStr(att.remaining);
  if (++tickN % 5 === 0) save();
}

/* Results and profile */
function vSResults() {
  const mine = S.submissions.filter(x => x.studentId === S.student.id), exs = mine.filter(x => x.type === 'exam');
  const avg = exs.length ? Math.round(exs.reduce((a, b) => a + b.percent, 0) / exs.length) : null;
  return `<div class="hello"><h1>Results</h1><p class="small muted">Your submitted exams and activities, with scores where they apply.</p></div>
  <div class="grid stats">${stat('exam', 'Exams taken', exs.length, 'Submitted')}${stat('trophy', 'Average', avg === null ? '—' : avg + '%', 'Across exams')}${stat('check', 'Passed', exs.filter(x => x.passed).length, 'Against each pass mark')}${stat('activity', 'Activities', mine.filter(x => x.type === 'activity').length, 'Submitted')}</div>
  ${mine.length ? `<ul class="cards-list">${mine.map(resultItemS).join('')}</ul>` : empty('trophy', 'No results yet', 'Submitted exams and activities appear here.', ctaLink('#student/home', 'Go to home', true))}`;
}
function vProfile() {
  const st = me(), s = currentSession();
  return `<div class="hello"><h1>Profile</h1><p class="small muted">Only what this prototype needs. No contact details are collected.</p></div>
  <section class="card"><form data-form="profile" novalidate><label class="field"><span class="label">Display name</span><input class="input" name="name" value="${esc(S.student.displayName)}" maxlength="20"></label><button type="submit" class="btn btn-primary">Save name</button></form>
    ${st ? `<dl class="facts mt"><div><dt>Student number</dt><dd class="mono">XXXX-${st.number.slice(-4)}</dd></div><div><dt>Class</dt><dd>${esc(S.settings.className)}</dd></div><div><dt>Section</dt><dd>${st.section}</dd></div></dl>` : `<dl class="facts mt"><div><dt>Student number</dt><dd class="mono">—</dd></div><div><dt>Class</dt><dd>${esc(S.settings.className)}</dd></div><div><dt>Section</dt><dd>—</dd></div></dl>`}</section>
  <section class="card mt"><h2>Appearance</h2><label class="field mt"><span class="label">Theme preference</span><select class="select" data-change="setting" data-setting="theme">${opts([['light', 'Light (Forest Tech default)'], ['dark', 'Dark'], ['system', 'Match this device']], S.settings.theme)}</select></label></section>
  <section class="card mt"><h2>Session</h2>${s ? `<p class="small">Joined <b class="mono">${esc(s.code)}</b> · ${esc(s.title)}</p><div class="btn-row mt">${ctaButton('session-leave', 'Leave session')}</div>` : '<p class="small muted">Not joined to a session.</p>'}
    <p class="xs muted mt">Your data stays in this browser's local storage. It is not device storage and is not synced anywhere.</p>
    <div class="btn-row mt"><button type="button" class="btn btn-sm btn-danger" data-action="reset-demo">${I('refresh')}Clear all data</button></div></section>`;
}
FORMS.profile = f => {
  if (!validate(f, [{ name: 'name', req: 'Enter a display name.', max: 20 }])) return;
  S.student.displayName = formData(f).name.trim(); commit(); toast('Name saved.');
};

ACTIONS['csv-copy'] = async () => {
  if (await copyText(CSV_TEXT)) { toast('CSV copied.'); return; }
  const ta = $('#csv-text'); if (ta) { ta.focus(); ta.select(); }
  toast('Copy is blocked here. The text is selected. Press Ctrl+C or Cmd+C.', 'warn');
};

/* ===== 15. Startup ===== */
document.addEventListener('click', onClick);
document.addEventListener('input', onInput);
document.addEventListener('change', onChange);
document.addEventListener('submit', onSubmit);
document.addEventListener('keydown', onKey);
window.addEventListener('hashchange', render);
S = load();
try { if (!location.hash) history.replaceState(null, '', '#teacher/dashboard'); } catch (e) { /* a viewer may refuse URL changes; the default route still renders */ }
applyTheme();
render();
setInterval(tick, 1000);
</script>
</body>
